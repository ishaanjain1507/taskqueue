name: Keep Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier services from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping taskqueue-api
        run: curl -fsS --max-time 30 "${{ secrets.RENDER_API_URL }}/health" || true

      - name: Ping taskqueue-prometheus
        run: curl -fsS --max-time 30 "${{ secrets.RENDER_PROMETHEUS_URL }}/-/healthy" || true

      - name: Ping taskqueue-grafana
        run: curl -fsS --max-time 30 "${{ secrets.RENDER_GRAFANA_URL }}/api/health" || true
